<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PokéRPG · protótipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;600;700&family=Pixelify+Sans:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>
<header class="top">
  <div class="brand">PokéRPG<small>protótipo de RPG de texto</small></div>
  <div class="top-r" id="topr"></div>
</header>
<div id="app"></div>

<script>
  // Módulos ES não carregam por file:// (duplo-clique no arquivo): sem este aviso a tela ficaria vazia sem explicação.
  if (location.protocol === 'file:') document.getElementById('app').innerHTML =
    '<main class="create"><div class="notice">Este jogo precisa ser aberto por um servidor, não direto do arquivo. ' +
    'Na pasta do projeto, rode <code>python -m http.server 3000</code> e abra <b>http://localhost:3000</b>.</div></main>';
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
