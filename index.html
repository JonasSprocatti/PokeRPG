<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PokéRPG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilo.css">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="img/icone-192.png">
<link rel="apple-touch-icon" href="img/icone-192.png">
<meta name="theme-color" content="#161A33">
</head>
<body>
<header class="top">
  <div class="brand"><img src="img/logo.png" alt="PokéRPG" class="logo" width="373" height="309"><small>RPG de texto</small></div>
  <div class="top-r">
    <span id="top-dinheiro" class="dinheiro"></span>
    <!-- celular: os botões vão pra dentro do menu ☰ (no computador .menu-links é display:contents — some da conta) -->
    <button type="button" id="menu-burger" class="burger" aria-label="Abrir menu" aria-expanded="false" aria-controls="menu-links">☰</button>
    <nav id="menu-links" class="menu-links" aria-label="Menu"><div class="top-r" id="topr"></div><div id="conta-chip"></div></nav>
  </div>
</header>
<div id="app"></div>

<script>
  // Módulos ES não carregam por file:// (duplo-clique no arquivo): sem este aviso a tela ficaria vazia sem explicação.
  if (location.protocol === 'file:') document.getElementById('app').innerHTML =
    '<main class="create"><div class="notice">Este jogo precisa ser aberto por um servidor, não direto do arquivo. ' +
    'Na pasta do projeto, rode <code>python -m http.server 3000</code> e abra <b>http://localhost:3000</b>.</div></main>';
</script>
<script type="module" src="js/main.js"></script>
<script>
  // modo offline: service worker guarda o jogo, a PokéAPI e os sprites depois do primeiro acesso online (sw.js)
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').catch(e => console.warn('service worker', e));
    /* Versão nova assumiu o controle? Recarrega a aba UMA vez. O sw.js já ativa sozinho (skipWaiting +
       clients.claim), mas isso troca só o service worker: a aba aberta continua com os arquivos .js que carregou
       quando abriu, porque módulo ES é carregado uma vez por sessão. Sem isto, quem deixa o jogo aberto fica
       testando a versão velha sem saber — aconteceu de verdade, com correção publicada e o erro antigo na tela. */
    let recarregando = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (recarregando) return; recarregando = true; location.reload();
    });
  }
</script>
</body>
</html>
