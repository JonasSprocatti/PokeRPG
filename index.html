<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PokéRPG · protótipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#161A33; --panel:#1F2447; --panel2:#282E5A; --line:#394180;
  --text:#EEE8D8; --muted:#A3A6C8; --yellow:#F7C548; --grass:#5FB36A; --red:#E4572E;
  --paper:#F4EFE3; --paper-ink:#1C1F3A;
  --pixel:'Pixelify Sans', ui-monospace, 'Courier New', monospace;
  --body:'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--ink);color:var(--text);font:16px/1.5 var(--body);min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
img{max-width:100%}
.muted{color:var(--muted)} .small{font-size:14px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;border-bottom:2px solid var(--line)}
.brand{font:700 22px var(--pixel);color:var(--yellow)}
.brand small{font:500 13px var(--pixel);color:var(--muted);margin-left:10px}
.top-r{display:flex;gap:14px;align-items:center;font:700 16px var(--pixel)}

.btn{background:var(--yellow);color:#1b1b2f;border:0;border-radius:8px;padding:10px 16px;font-weight:700}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--text);border:2px solid var(--line)}
.btn.ghost:hover:not(:disabled){border-color:var(--yellow)}
.btn.big{padding:14px 22px;font-size:17px}
.btn.sm{padding:5px 10px;font-size:14px}

.ty{display:inline-block;padding:1px 10px;border-radius:999px;font:700 12px/1.6 var(--pixel);background:var(--c);color:var(--tc)}
.types{display:flex;gap:6px;flex-wrap:wrap}

/* criação */
.create{max-width:1100px;margin:0 auto;padding:32px 20px 60px}
.create h1{font:700 clamp(34px,5.5vw,60px)/1.02 var(--pixel);margin:0 0 12px;color:var(--yellow);max-width:14ch}
.create .lead{max-width:62ch;color:var(--muted);margin:0}
.search{display:flex;gap:10px;margin:26px 0 16px;flex-wrap:wrap}
.search input{flex:1;min-width:220px;background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:12px 14px;font-size:17px}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px}
.pick{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:2px 2px 6px;display:grid;place-items:center;font-size:12px;color:var(--muted)}
.pick:hover{border-color:var(--yellow);color:var(--text)}
.pick img{width:72px;height:72px;image-rendering:pixelated}
.notice{background:#3a1f2a;border:2px solid var(--red);border-radius:12px;padding:14px 16px;margin-top:18px}
.loading{font:500 16px var(--pixel);color:var(--muted)}
.err{color:#ff9b82}

.pv{display:grid;grid-template-columns:minmax(220px,320px) 1fr;gap:28px;margin-top:28px;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:24px}
@media(max-width:760px){.pv{grid-template-columns:1fr}}
.pv-art{background:var(--panel2);border-radius:14px;display:grid;place-items:center;padding:10px;align-self:start}
.pv-art img{width:100%;aspect-ratio:1;object-fit:contain}
.dexno{font:500 14px var(--pixel);color:var(--muted);margin:0}
.pv h2{font:700 40px/1.1 var(--pixel);margin:2px 0 10px}
.pv h3{font:700 16px var(--pixel);color:var(--yellow);margin:20px 0 8px}
.bs{display:grid;grid-template-columns:90px 38px 1fr;align-items:center;gap:8px;font-size:14px}
.bs span{color:var(--muted)} .bs b{text-align:right;font-family:var(--pixel)}
.bs i{display:block;height:8px;border-radius:4px;background:var(--yellow)}
.bs.total i{background:none}
.basestats{display:grid;gap:3px;margin-top:16px}
.abils{display:grid;gap:8px}
.abil{text-align:left;background:var(--panel2);border:2px solid var(--line);border-radius:10px;padding:10px 12px}
.abil.on{border-color:var(--yellow)}
.abil em{font-style:normal;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-left:6px}
.abil small{display:block;color:var(--muted);margin-top:2px}
.impl{font-size:12px;color:var(--grass);margin-left:6px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
@media(max-width:560px){.row3{grid-template-columns:1fr}}
.row3 label{display:grid;gap:4px;font-size:14px;color:var(--muted)}
.row3 select,.row3 input{background:var(--panel2);border:2px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--text)}
.pv .btn.big{margin-top:18px}

/* jogo */
.game{display:grid;grid-template-columns:minmax(300px,370px) 1fr;gap:20px;padding:20px;max-width:1280px;margin:0 auto}
@media(max-width:880px){.game{grid-template-columns:1fr}.stage{order:-1}}
.sheet{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:18px;align-self:start}
.me{display:flex;gap:12px;align-items:center}
.me img{width:96px;height:96px;image-rendering:pixelated;background:var(--panel2);border-radius:12px;flex:none}
.me h2{margin:0;font:700 26px/1.1 var(--pixel)}
.me .sub{color:var(--muted);font-size:14px;margin:2px 0 6px}
.bars{margin:14px 0 6px;display:grid;gap:6px}
.hp{display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:8px;font:700 12px var(--pixel)}
.bar{height:10px;border-radius:5px;background:#0f1230;overflow:hidden}
.fill{height:100%;border-radius:5px;transition:width .45s ease}
.xp .fill{background:#6fa8ff}
.chips{display:flex;gap:4px;flex-wrap:wrap;min-height:4px;margin-top:4px}
.st{font:700 11px/1.7 var(--pixel);padding:0 7px;border-radius:5px;background:#555;color:#fff}
.st-burn{background:#d9532b}.st-poison{background:#9b3fa0}.st-paralysis{background:#c9a400;color:#222}.st-sleep{background:#6c7086}.st-freeze{background:#4fb3c9;color:#12303a}
.stg{font:700 11px/1.7 var(--pixel);padding:0 6px;border-radius:5px}
.stg.up{background:#2f7a45;color:#e8ffe9}.stg.down{background:#8f3526;color:#ffe9e4}
table.stats{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
table.stats th{font-weight:400;color:var(--muted);text-align:right;padding:2px 4px;font-size:12px}
table.stats td{text-align:right;padding:4px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
table.stats td:first-child,table.stats th:first-child{text-align:left}
table.stats td.v{font:700 15px var(--pixel)}
.up{color:#7fd88a}.down{color:#ff8a6b}
.sec{margin-top:18px}
.sec h3{font:700 15px var(--pixel);color:var(--yellow);margin:0 0 6px}
.sec p{margin:0}
.mlist details{border-top:1px solid var(--line);padding:6px 0}
.mlist summary{display:grid;grid-template-columns:1fr auto;gap:2px 8px;cursor:pointer;list-style:none}
.mlist summary::-webkit-details-marker{display:none}
.mlist summary b{font:700 15px var(--pixel)}
.mlist summary small{color:var(--muted);grid-column:1/-1}
.mlist .pp{font:500 13px var(--pixel);color:var(--yellow)}
.mlist details p{font-size:13px;color:var(--muted);margin:4px 0 2px}
ul.bag{list-style:none;margin:0;padding:0;display:grid;gap:6px}
ul.bag li{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:8px}
ul.bag img{width:30px;height:30px;image-rendering:pixelated}
ul.bag small{display:block;color:var(--muted);font-size:12px}

.scene{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:18px;min-height:290px}
.zone-head h2{font:700 30px/1.1 var(--pixel);margin:0}
.zone-head p{margin:4px 0 0;color:var(--muted)}
.zones{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.chip{background:var(--panel2);border:2px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px}
.chip small{color:var(--muted);margin-left:6px;font-family:var(--pixel)}
.chip.on{border-color:var(--yellow)}
.locals{display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-height:72px}
.locals img{width:64px;height:64px;image-rendering:pixelated;filter:brightness(0) invert(.75);opacity:.55}

.scene.battle{display:grid;grid-template-rows:1fr 1fr;gap:6px;background:linear-gradient(#34428a 0 52%,#3d6a4b 52%);padding:14px 18px}
.side{display:flex;align-items:center;justify-content:space-between;gap:12px}
.side.foe .mon{order:2}
.mon{position:relative;width:170px;height:130px;display:grid;place-items:end center;flex:none}
.pad{position:absolute;bottom:4px;left:8px;right:8px;height:30px;border-radius:50%;background:rgba(0,0,0,.25)}
.spr{position:relative;width:128px;height:128px;image-rendering:pixelated}
.spr.back{width:150px;height:150px}
.spr.flip{transform:scaleX(-1)}
.mon.fainted .spr{opacity:.15;transition:opacity .5s}
.plate{background:var(--paper);color:var(--paper-ink);border-radius:10px;padding:9px 12px;width:min(270px,100%);box-shadow:4px 4px 0 rgba(0,0,0,.3)}
.pl-top{display:flex;justify-content:space-between;gap:8px;font:700 16px var(--pixel)}
.plate .bar{background:#cfc8b6}
@media(max-width:520px){.mon{width:110px;height:100px}.spr{width:96px;height:96px}.spr.back{width:110px;height:110px}.pl-top{font-size:14px}}
@keyframes shake{0%,100%{translate:0}25%{translate:-7px 0}75%{translate:7px 0}}
.mon.shake{animation:shake .25s 2}

.textbox{margin-top:14px;background:var(--paper);color:var(--paper-ink);border-radius:10px;border:3px solid var(--paper-ink);box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 5px #6d74b8;padding:5px}
.log{height:180px;overflow-y:auto;padding:10px 14px;font-size:15px}
.log p{margin:0 0 4px}
.log .good{color:#1f7a3a}.log .hit{color:#a83418}.log .level{color:#5a33c2}.log .muted{color:#6b6e8f}
.log .crit{color:#c2410c;font-weight:700}.log .status{color:#8a4b0f}.log .enc{font-size:16px}

.actions{margin-top:14px;display:flex;flex-wrap:wrap;gap:10px}
.moves{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
@media(max-width:420px){.moves{grid-template-columns:1fr}}
.mv{text-align:left;background:var(--panel2);border:2px solid var(--line);border-left:8px solid var(--c);border-radius:10px;padding:9px 12px;display:grid;gap:1px}
.mv b{font:700 17px var(--pixel)}
.mv small{color:var(--muted);font-size:13px}
.mv .pp{font:500 13px var(--pixel);color:var(--yellow)}
.mv:hover:not(:disabled){border-color:var(--c)}
.subrow{display:flex;gap:10px;width:100%;flex-wrap:wrap}
.bag-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;width:100%}
.item-btn{display:grid;grid-template-columns:30px 1fr;align-items:center;gap:2px 8px;text-align:left;background:var(--panel2);border:2px solid var(--line);border-radius:10px;padding:8px}
.item-btn img{grid-row:span 2;width:30px;height:30px;image-rendering:pixelated}
.item-btn small{color:var(--muted);font-size:12px}
.item-btn:hover:not(:disabled){border-color:var(--yellow)}

.modal{position:fixed;inset:0;background:rgba(10,12,30,.72);display:grid;place-items:center;padding:20px;z-index:10}
.box{background:var(--panel);border:2px solid var(--yellow);border-radius:14px;padding:20px;max-width:520px;width:100%;max-height:90vh;overflow:auto}
.box-body{font-size:17px}
.choices{display:grid;gap:8px;margin-top:16px}
.mcard{margin-top:10px;padding:10px 12px;background:var(--panel2);border-radius:10px;font-size:14px;color:var(--muted)}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">PokéRPG<small>protótipo de RPG de texto</small></div>
  <div class="top-r" id="topr"></div>
</header>
<div id="app"></div>

<script>
/* ============ utilidades ============ */
const API = 'https://pokeapi.co/api/v2';
const SPR = id => `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`;
const ITEM_SPR = n => `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/${n}.png`;
const SAVE_KEY = 'pokerpg-save-v1';
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = s => document.querySelector(s);
const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fmt = s => String(s || '').split('-').map(w => w ? w[0].toUpperCase() + w.slice(1) : w).join(' ');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};

/* ============ dados fixos ============ */
const STATS = ['hp', 'attack', 'defense', 'special-attack', 'special-defense', 'speed'];
const STAT_PT = { hp: 'HP', attack: 'Ataque', defense: 'Defesa', 'special-attack': 'At. Esp.', 'special-defense': 'Def. Esp.', speed: 'Velocidade', accuracy: 'Precisão', evasion: 'Evasão' };
const STAGE_SHORT = { attack: 'Atq', defense: 'Def', 'special-attack': 'AtE', 'special-defense': 'DfE', speed: 'Vel', accuracy: 'Prec', evasion: 'Eva' };
const TYPE_PT = { normal: 'Normal', fire: 'Fogo', water: 'Água', electric: 'Elétrico', grass: 'Planta', ice: 'Gelo', fighting: 'Lutador', poison: 'Venenoso', ground: 'Terrestre', flying: 'Voador', psychic: 'Psíquico', bug: 'Inseto', rock: 'Pedra', ghost: 'Fantasma', dragon: 'Dragão', dark: 'Sombrio', steel: 'Aço', fairy: 'Fada' };
const TC = { normal: '#A8A77A', fire: '#EE8130', water: '#6390F0', electric: '#F7D02C', grass: '#7AC74C', ice: '#96D9D6', fighting: '#C22E28', poison: '#A33EA1', ground: '#E2BF65', flying: '#A98FF3', psychic: '#F95587', bug: '#A6B91A', rock: '#B6A136', ghost: '#735797', dragon: '#6F35FC', dark: '#705746', steel: '#B7B7CE', fairy: '#D685AD' };
const DARK_TEXT = new Set(['normal', 'electric', 'grass', 'ice', 'ground', 'bug', 'rock', 'steel', 'fairy', 'flying']);
const CLS_PT = { physical: 'Físico', special: 'Especial', status: 'Status' };

// tabela de tipos (Gen 6+): se = super efetivo, nv = pouco efetivo, im = imune
const CHART = {
  normal: { se: [], nv: ['rock', 'steel'], im: ['ghost'] },
  fire: { se: ['grass', 'ice', 'bug', 'steel'], nv: ['fire', 'water', 'rock', 'dragon'] },
  water: { se: ['fire', 'ground', 'rock'], nv: ['water', 'grass', 'dragon'] },
  electric: { se: ['water', 'flying'], nv: ['electric', 'grass', 'dragon'], im: ['ground'] },
  grass: { se: ['water', 'ground', 'rock'], nv: ['fire', 'grass', 'poison', 'flying', 'bug', 'dragon', 'steel'] },
  ice: { se: ['grass', 'ground', 'flying', 'dragon'], nv: ['fire', 'water', 'ice', 'steel'] },
  fighting: { se: ['normal', 'ice', 'rock', 'dark', 'steel'], nv: ['poison', 'flying', 'psychic', 'bug', 'fairy'], im: ['ghost'] },
  poison: { se: ['grass', 'fairy'], nv: ['poison', 'ground', 'rock', 'ghost'], im: ['steel'] },
  ground: { se: ['fire', 'electric', 'poison', 'rock', 'steel'], nv: ['grass', 'bug'], im: ['flying'] },
  flying: { se: ['grass', 'fighting', 'bug'], nv: ['electric', 'rock', 'steel'] },
  psychic: { se: ['fighting', 'poison'], nv: ['psychic', 'steel'], im: ['dark'] },
  bug: { se: ['grass', 'psychic', 'dark'], nv: ['fire', 'fighting', 'poison', 'flying', 'ghost', 'steel', 'fairy'] },
  rock: { se: ['fire', 'ice', 'flying', 'bug'], nv: ['fighting', 'ground', 'steel'] },
  ghost: { se: ['psychic', 'ghost'], nv: ['dark'], im: ['normal'] },
  dragon: { se: ['dragon'], nv: ['steel'], im: ['fairy'] },
  dark: { se: ['psychic', 'ghost'], nv: ['fighting', 'dark', 'fairy'] },
  steel: { se: ['ice', 'rock', 'fairy'], nv: ['fire', 'water', 'electric', 'steel'] },
  fairy: { se: ['fighting', 'dragon', 'dark'], nv: ['fire', 'poison', 'steel'] }
};
function typeEff(atk, defs) {
  const c = CHART[atk]; if (!c) return 1;
  return defs.reduce((f, d) => f * ((c.im || []).includes(d) ? 0 : c.se.includes(d) ? 2 : c.nv.includes(d) ? 0.5 : 1), 1);
}

const NATURES = {
  hardy: [], lonely: ['attack', 'defense'], brave: ['attack', 'speed'], adamant: ['attack', 'special-attack'], naughty: ['attack', 'special-defense'],
  bold: ['defense', 'attack'], docile: [], relaxed: ['defense', 'speed'], impish: ['defense', 'special-attack'], lax: ['defense', 'special-defense'],
  timid: ['speed', 'attack'], hasty: ['speed', 'defense'], serious: [], jolly: ['speed', 'special-attack'], naive: ['speed', 'special-defense'],
  modest: ['special-attack', 'attack'], mild: ['special-attack', 'defense'], quiet: ['special-attack', 'speed'], bashful: [], rash: ['special-attack', 'special-defense'],
  calm: ['special-defense', 'attack'], gentle: ['special-defense', 'defense'], sassy: ['special-defense', 'speed'], careful: ['special-defense', 'special-attack'], quirky: []
};
const natureMod = (n, s) => (NATURES[n] || [])[0] === s ? 1.1 : (NATURES[n] || [])[1] === s ? 0.9 : 1;
const natureLabel = n => { const [u, d] = NATURES[n] || []; return fmt(n) + (u ? ` (+${STAT_PT[u]} −${STAT_PT[d]})` : ' (neutra)'); };

// habilidades que o protótipo realmente aplica em batalha
const PINCH = { overgrow: 'grass', blaze: 'fire', torrent: 'water', swarm: 'bug' };
const ABSORB = { levitate: { type: 'ground' }, 'flash-fire': { type: 'fire' }, 'volt-absorb': { type: 'electric', heal: true }, 'water-absorb': { type: 'water', heal: true } };
const IMPL = new Set([...Object.keys(PINCH), ...Object.keys(ABSORB), 'guts', 'intimidate', 'adaptability', 'run-away']);

const SELF_TARGETS = new Set(['user', 'users-field', 'user-or-ally', 'user-and-allies', 'entire-field', 'all-allies', 'ally']);
const FIXED = {
  'seismic-toss': u => u.level, 'night-shade': u => u.level, 'dragon-rage': () => 40, 'sonic-boom': () => 20,
  'super-fang': (u, t) => Math.floor(t.hp / 2), psywave: u => Math.floor(u.level * rand(50, 150) / 100)
};
const STRUGGLE = { name: 'struggle', type: 'normal', cls: 'physical', power: 50, acc: null, priority: 0, target: 'selected-pokemon', meta: { drain: -25 }, stats: [], desc: '' };

const AIL_MSG = { paralysis: 'ficou paralisado', sleep: 'adormeceu', freeze: 'foi congelado', burn: 'foi queimado', poison: 'foi envenenado' };
const ST_SHORT = { paralysis: 'PAR', sleep: 'DRM', freeze: 'CGL', burn: 'QMD', poison: 'ENV' };

const ITEMS = {
  potion: { name: 'Potion', desc: 'Recupera 20 HP.', heal: 20, price: 200 },
  'super-potion': { name: 'Super Potion', desc: 'Recupera 60 HP.', heal: 60, price: 600 },
  'hyper-potion': { name: 'Hyper Potion', desc: 'Recupera 120 HP.', heal: 120, price: 1200 },
  antidote: { name: 'Antidote', desc: 'Cura envenenamento.', cure: ['poison'], price: 100 },
  'paralyze-heal': { name: 'Paralyze Heal', desc: 'Cura paralisia.', cure: ['paralysis'], price: 200 },
  awakening: { name: 'Awakening', desc: 'Acorda do sono.', cure: ['sleep'], price: 250 },
  'burn-heal': { name: 'Burn Heal', desc: 'Cura queimadura.', cure: ['burn'], price: 250 },
  'ice-heal': { name: 'Ice Heal', desc: 'Descongela.', cure: ['freeze'], price: 250 },
  'full-heal': { name: 'Full Heal', desc: 'Cura qualquer status.', cure: 'all', price: 600 },
  ether: { name: 'Ether', desc: 'Restaura 10 PP de cada golpe.', ether: 10, price: 800 },
  'x-attack': { name: 'X Attack', desc: 'Ataque +2 nesta batalha.', stage: 'attack', battle: true, price: 500 },
  'x-defense': { name: 'X Defense', desc: 'Defesa +2 nesta batalha.', stage: 'defense', battle: true, price: 500 },
  'x-sp-atk': { name: 'X Sp. Atk', desc: 'At. Esp. +2 nesta batalha.', stage: 'special-attack', battle: true, price: 500 },
  'x-speed': { name: 'X Speed', desc: 'Velocidade +2 nesta batalha.', stage: 'speed', battle: true, price: 500 },
  'rare-candy': { name: 'Rare Candy', desc: 'Sobe um nível na hora.', candy: true }
};
const FIND_ITEMS = ['potion', 'potion', 'potion', 'super-potion', 'antidote', 'paralyze-heal', 'awakening', 'ether', 'x-attack', 'rare-candy'];

const ZONES = [

const memo = new Map();
async function getJSON(url) {

  return r.json();
}
function cached(key, loader) {

  const hit = store.get('pk:' + key);
  if (hit) { memo.set(key, hit); return Promise.resolve(hit); }
  const p = loader().then(v => { memo.set(key, v); store.set('pk:' + key, v); return v; })
    .catch(e => { memo.delete(key); throw e; });

  return p;
}
function syncGet(key) { const v = memo.get(key); return v && !(v instanceof Promise) ? v : null; }

const VG_PREF = ['scarlet-violet', 'sword-shield', 'brilliant-diamond-shining-pearl', 'ultra-sun-ultra-moon', 'sun-moon', 'omega-ruby-alpha-sapphire', 'x-y', 'black-2-white-2', 'black-white', 'heartgold-soulsilver', 'platinum', 'diamond-pearl', 'emerald', 'firered-leafgreen', 'ruby-sapphire', 'crystal', 'gold-silver', 'yellow', 'red-blue'];
function buildLearnset(moves) {
  const groups = {};
  for (const m of moves) for (const d of m.version_group_details) {
    if (d.move_learn_method.name !== 'level-up') continue;
    (groups[d.version_group.name] ||= []).push({ name: m.move.name, url: m.move.url, level: d.level_learned_at });
  }
  const vg = VG_PREF.find(g => groups[g]?.length) || Object.keys(groups)[0];
  const seen = new Map();
  for (const e of (groups[vg] || [])) if (!seen.has(e.name) || seen.get(e.name).level > e.level) seen.set(e.name, e);
  return { vg: vg || '', list: [...seen.values()].sort((a, b) => a.level - b.level) };
}
function slimPokemon(p) {

    id: p.id, name: p.name, speciesName: p.species.name, speciesUrl: p.species.url,
    types: [...p.types].sort((a, b) => a.slot - b.slot).map(t => t.type.name),
    base: Object.fromEntries(p.stats.map(s => [s.stat.name, s.base_stat])),
    effort: Object.fromEntries(p.stats.filter(s => s.effort > 0).map(s => [s.stat.name, s.effort])),
    baseExp: p.base_experience || 60,
    abilities: p.abilities.map(a => ({ name: a.ability.name, url: a.ability.url, hidden: a.is_hidden })),
    sprite: p.sprites.front_default || SPR(p.id), back: p.sprites.back_default,
    art: p.sprites.other?.['official-artwork']?.front_default || p.sprites.front_default,

}
function slimMove(m) {

  if (!desc) { const ft = (m.flavor_text_entries || []).filter(f => f.language.name === 'en').pop(); desc = ft ? ft.flavor_text.replace(/\s+/g, ' ') : ''; }
  const mt = m.meta;

    name: m.name, type: m.type.name, cls: m.damage_class?.name || 'status', power: m.power, acc: m.accuracy, pp: m.pp || 10,
    priority: m.priority || 0, target: m.target?.name || 'selected-pokemon',
    meta: mt ? { ailment: mt.ailment?.name || 'none', ailChance: mt.ailment_chance || 0, crit: mt.crit_rate || 0, drain: mt.drain || 0, heal: mt.healing || 0, flinch: mt.flinch_chance || 0, statChance: mt.stat_chance || 0, minHits: mt.min_hits || 0, maxHits: mt.max_hits || 0, cat: mt.category?.name || '' } : {},

}

function calcStats(m) {
  const out = {};
  for (const s of STATS) {
    const core = Math.floor((2 * m.data.base[s] + m.ivs[s] + Math.floor(m.evs[s] / 4)) * m.level / 100);
    out[s] = s === 'hp' ? (m.data.base.hp === 1 ? 1 : core + m.level + 10) : Math.floor((core + 5) * natureMod(m.nature, s));
  }
  return out;
}
function recalc(m) { const old = m.stats.hp; m.stats = calcStats(m); m.hp = clamp(m.hp + (m.stats.hp - old), 0, m.stats.hp); }
const freshVol = () => ({ stages: { attack: 0, defense: 0, 'special-attack': 0, 'special-defense': 0, speed: 0, accuracy: 0, evasion: 0 }, conf: 0, flinch: false, flashFire: false });
const stageMul = n => n >= 0 ? (2 + n) / 2 : 2 / (2 - n);
function effStat(m, stat, crit = false, attacking = true) {
  let st = m.vol?.stages[stat] || 0;
  if (crit) { if (attacking && st < 0) st = 0; if (!attacking && st > 0) st = 0; }
  let v = m.stats[stat] * stageMul(st);
  if (stat === 'speed' && m.status === 'paralysis') v *= 0.5;
  if (stat === 'attack' && m.status && m.ability === 'guts') v *= 1.5;
  return Math.max(1, Math.floor(v));
}
function defaultMoves(list, level) {
  const avail = list.filter(m => m.level <= level), seen = new Set(), out = [];
  for (let i = avail.length - 1; i >= 0 && out.length < 4; i--) if (!seen.has(avail[i].name)) { seen.add(avail[i].name); out.push(avail[i]); }
  if (!out.length && list.length) out.push(list[0]);
  if (!out.length) out.push({ name: 'tackle', url: `${API}/move/33/`, level: 1 });
  return out.reverse();
}
async function makeMon(data, level, opt = {}) {
  const ivs = opt.ivs || Object.fromEntries(STATS.map(s => [s, rand(0, 31)]));
  const evs = opt.evs || Object.fromEntries(STATS.map(s => [s, 0]));
  const nature = opt.nature || pick(Object.keys(NATURES));
  const normal = data.abilities.filter(a => !a.hidden);
  const ability = opt.ability || (pick(normal.length ? normal : data.abilities) || { name: 'none' }).name;
  const refs = defaultMoves(data.learnset.list, level);
  const moves = (await Promise.all(refs.map(r => loadMove(r.url).catch(() => null)))).filter(Boolean).map(m => ({ ...m, ppLeft: m.pp }));
  const mon = { id: data.id, name: data.name, nick: opt.nick || '', data, level, ivs, evs, nature, ability, moves, status: null, sleep: 0, exp: 0, vol: freshVol() };
  mon.stats = calcStats(mon); mon.hp = mon.stats.hp;
  return mon;
}
function calcDamage(u, t, move) {
  if (FIXED[move.name]) return { dmg: Math.max(1, FIXED[move.name](u, t)), crit: false };
  const power = move.power || 60, phys = move.cls === 'physical';
  const crit = Math.random() < [1 / 24, 1 / 8, 1 / 2, 1][Math.min(3, move.meta?.crit || 0)];
  const A = effStat(u, phys ? 'attack' : 'special-attack', crit, true);
  const D = effStat(t, phys ? 'defense' : 'special-defense', crit, false);
  const base = Math.floor(Math.floor(Math.floor(2 * u.level / 5 + 2) * power * A / D) / 50) + 2;
  let mod = (crit ? 1.5 : 1) * rand(85, 100) / 100;
  if (u.data.types.includes(move.type)) mod *= u.ability === 'adaptability' ? 2 : 1.5;
  mod *= typeEff(move.type, t.data.types);
  if (phys && u.status === 'burn' && u.ability !== 'guts') mod *= 0.5;
  if (PINCH[u.ability] === move.type && u.hp <= u.stats.hp / 3) mod *= 1.5;
  if (u.vol.flashFire && move.type === 'fire') mod *= 1.5;
  return { dmg: Math.max(1, Math.floor(base * mod)), crit };
}
function confDamage(u) {
  const A = effStat(u, 'attack'), D = effStat(u, 'defense');

}
const heal = (m, h) => { m.hp = Math.min(m.stats.hp, m.hp + h); };

async function changeStats(m, changes) {
  for (const c of changes) {
    if (!(c.stat in m.vol.stages)) continue;
    const cur = m.vol.stages[c.stat], nv = clamp(cur + c.change, -6, 6);
    if (nv === cur) { await say(`${STAT_PT[c.stat]} de ${nm(m)} não pode ${c.change > 0 ? 'subir' : 'cair'} mais!`); continue; }
    m.vol.stages[c.stat] = nv;
    const d = Math.abs(c.change), up = c.change > 0;
    const w = up ? (d >= 3 ? 'subiu drasticamente' : d === 2 ? 'subiu muito' : 'subiu') : (d >= 3 ? 'caiu drasticamente' : d === 2 ? 'caiu muito' : 'caiu');
    await say(`${STAT_PT[c.stat]} de ${nm(m)} ${w}!`, up ? 'good' : 'status');
  }
  render();
}
async function inflict(t, ail, announce = false) {
  if (ail === 'confusion') {
    if (t.vol.conf > 0) { if (announce) await say(`${nm(t)} já está confuso!`); return; }
    t.vol.conf = rand(2, 5); await say(`${nm(t)} ficou confuso!`, 'status'); return;
  }
  if (!AIL_MSG[ail]) { if (announce) await say('Mas nada aconteceu... (efeito ainda não implementado)', 'muted'); return; }
  if (t.status) { if (announce) await say(`${nm(t)} já tem uma condição de status.`); return; }
  const ty = t.data.types;
  const immune = (ail === 'paralysis' && ty.includes('electric')) || (ail === 'burn' && ty.includes('fire')) || (ail === 'freeze' && ty.includes('ice')) || (ail === 'poison' && (ty.includes('poison') || ty.includes('steel')));
  if (immune) { if (announce) await say(`Não afeta ${nm(t)}...`); return; }
  t.status = ail; if (ail === 'sleep') t.sleep = rand(2, 4);
  render(); await say(`${nm(t)} ${AIL_MSG[ail]}!`, 'status');
}
async function statusMove(user, target, move, selfT) {
  const meta = move.meta || {}; let did = false;
  if (meta.heal > 0) {
    did = true;
    if (user.hp >= user.stats.hp) await say(`O HP de ${nm(user)} já está cheio!`);
    else { heal(user, Math.floor(user.stats.hp * meta.heal / 100)); render(); await say(`${nm(user)} recuperou HP.`, 'good'); }
  }
  if (move.stats.length) { did = true; await changeStats(selfT || meta.cat === 'damage+raise' ? user : target, move.stats); }
  if (meta.ailment && meta.ailment !== 'none') {
    did = true;
    if (Math.random() * 100 < (meta.ailChance || 100)) await inflict(selfT ? user : target, meta.ailment, true);
  }
  if (!did) await say('Mas nada aconteceu... (efeito ainda não implementado no protótipo)', 'muted');
}
async function useMove(user, target, move, movedFirst) {
  const U = nm(user), T = nm(target);
  if (user.status === 'sleep') {
    user.sleep--;
    if (user.sleep > 0) { await say(`${U} está dormindo profundamente.`); return; }
    user.status = null; render(); await say(`${U} acordou!`);
  }
  if (user.status === 'freeze') {
    if (Math.random() < 0.2) { user.status = null; render(); await say(`${U} descongelou!`); }
    else { await say(`${U} está congelado!`); return; }
  }
  if (user.status === 'paralysis' && Math.random() < 0.25) { await say(`${U} está paralisado e não consegue se mover!`); return; }
  if (user.vol.flinch) { user.vol.flinch = false; await say(`${U} recuou e não conseguiu atacar!`); return; }
  if (user.vol.conf > 0) {
    user.vol.conf--;
    if (user.vol.conf === 0) await say(`${U} não está mais confuso.`);
    else {
      await say(`${U} está confuso...`);
      if (Math.random() < 1 / 3) { const d = confDamage(user); user.hp = Math.max(0, user.hp - d); render(); shake(user); await say(`Ele se machucou na confusão! (−${d})`, 'hit'); return; }
    }
  }
  if (move.ppLeft !== undefined) move.ppLeft = Math.max(0, move.ppLeft - 1);
  await say(`${U} usou <b style="color:${TC[move.type] || 'inherit'};filter:brightness(.7)">${esc(fmt(move.name))}</b>!`);

  const selfT = SELF_TARGETS.has(move.target), meta = move.meta || {};
  if (!selfT && move.acc != null) {
    const n = clamp((user.vol.stages.accuracy || 0) - (target.vol.stages.evasion || 0), -6, 6);
    if (Math.random() > move.acc / 100 * (n >= 0 ? (3 + n) / 3 : 3 / (3 - n))) { await say('Mas errou!'); return; }
  }
  if (move.cls === 'status') { await statusMove(user, target, move, selfT); render(); return; }

  const ab = ABSORB[target.ability];
  if (ab && ab.type === move.type) {
    await say(`A habilidade ${esc(fmt(target.ability))} de ${T} anulou o golpe!`);
    if (ab.heal && target.hp < target.stats.hp) { heal(target, Math.floor(target.stats.hp / 4)); render(); await say(`${T} recuperou HP.`, 'good'); }
    if (target.ability === 'flash-fire') target.vol.flashFire = true;
    return;
  }
  const eff = typeEff(move.type, target.data.types);
  if (eff === 0) { await say(`Não afeta ${T}...`); return; }

  const hits = meta.minHits ? rand(meta.minHits, meta.maxHits || meta.minHits) : 1;
  let total = 0, landed = 0, crit = false;
  for (let i = 0; i < hits && target.hp > 0; i++) {
    const r = calcDamage(user, target, move);
    target.hp = Math.max(0, target.hp - r.dmg); total += r.dmg; landed++; crit ||= r.crit;
  }
  render(); shake(target);
  if (crit) await say('Um golpe crítico!', 'crit');
  if (eff > 1) await say('É super efetivo!', 'good'); else if (eff < 1) await say('Não é muito efetivo...');
  if (hits > 1) await say(`Acertou ${landed} vez${landed > 1 ? 'es' : ''}!`);
  await say(`${T} perdeu ${total} HP.`, 'hit');

  if (meta.drain > 0) { const h = Math.max(1, Math.floor(total * meta.drain / 100)); heal(user, h); render(); await say(`${U} drenou ${h} HP.`, 'good'); }
  else if (meta.drain < 0) { const d = Math.max(1, Math.floor(total * -meta.drain / 100)); user.hp = Math.max(0, user.hp - d); render(); await say(`${U} sofreu ${d} de dano de recuo.`, 'hit'); }
  if (meta.heal > 0 && user.hp > 0) { heal(user, Math.floor(user.stats.hp * meta.heal / 100)); render(); }

  if (move.stats.length && Math.random() * 100 < (meta.statChance || 100)) {
    if (meta.cat === 'damage+raise' && user.hp > 0) await changeStats(user, move.stats);
    else if (meta.cat !== 'damage+raise' && target.hp > 0) await changeStats(target, move.stats);
  }
  if (target.hp > 0) {
    if (meta.ailment && meta.ailment !== 'none' && meta.ailChance > 0 && Math.random() * 100 < meta.ailChance) await inflict(target, meta.ailment);

  }
}

async function residual(m) {

async function turn(action) {
  if (busy || !B) return;
  busy = true; render();
  const P = S.player, E = B.enemy;
  try {
    if (action.type === 'run') {
      B.runs++;
      const a = effStat(P, 'speed'), b = effStat(E, 'speed');
      if (P.ability === 'run-away' || a >= b || Math.random() * 256 < Math.floor(a * 128 / b) + 30 * B.runs) {
        await say('Você fugiu em segurança!'); endBattle(); return;
      }
      await say('Não conseguiu fugir!');
      await useMove(E, P, chooseEnemyMove(E), true);
    } else if (action.type === 'item') {
      if (!(await useItem(action.id, true))) return;
      ui.panel = 'moves';
      await useMove(E, P, chooseEnemyMove(E), true);
    } else {
      const pm = action.idx === -1 ? STRUGGLE : P.moves[action.idx];
      const em = chooseEnemyMove(E);
      let pFirst;
      if ((pm.priority || 0) !== (em.priority || 0)) pFirst = (pm.priority || 0) > (em.priority || 0);
      else { const a = effStat(P, 'speed'), b = effStat(E, 'speed'); pFirst = a === b ? Math.random() < 0.5 : a > b; }
      const order = pFirst ? [[P, E, pm], [E, P, em]] : [[E, P, em], [P, E, pm]];
      for (let i = 0; i < 2; i++) {
        const [u, t, m] = order[i];
        if (u.hp <= 0 || t.hp <= 0) continue;
        await useMove(u, t, m, i === 0);
      }
    }
    if (P.hp > 0 && E.hp > 0) for (const m of [P, E]) await residual(m);
    P.vol.flinch = E.vol.flinch = false;
    B.turn++;
    if (P.hp <= 0) await lose();
    else if (E.hp <= 0) await win();
  } catch (e) {
    console.error(e); log('Algo deu errado neste turno: ' + esc(e.message), 'hit');
  } finally { busy = false; render(); save(); }
}
async function win() {
  const P = S.player, E = B.enemy;
  await say(`${nm(E)} desmaiou!`, 'good');
  const xp = Math.max(1, Math.floor(E.data.baseExp * E.level / 7));
  let total = STATS.reduce((a, s) => a + P.evs[s], 0);
  const gained = [];
  for (const [s, v] of Object.entries(E.data.effort)) {
    const add = Math.min(v, 252 - P.evs[s], 510 - total);
    if (add > 0) { P.evs[s] += add; total += add; gained.push(`+${add} EV de ${STAT_PT[s]}`); }
  }
  const money = E.level * rand(8, 14);
  S.money += money; S.wins = (S.wins || 0) + 1;
  await say(`${nm(P)} ganhou ${xp} de XP e ₽${money}.${gained.length ? ' ' + gained.join(', ') + '.' : ''}`);
  await gainExp(xp);
  endBattle();
}
async function lose() {
  await say(`${nm(S.player)} desmaiou...`, 'hit');
  const lost = Math.floor(S.money / 2); S.money -= lost;
  await say(`Você perdeu ₽${lost} e acordou no Centro Pokémon.`);
  healFull(); endBattle();
}
function endBattle() { B = null; mode = 'explore'; ui.panel = 'main'; S.player.vol = freshVol(); S.player.vol.flashFire = false; }
function healFull() { const P = S.player; P.hp = P.stats.hp; P.status = null; P.sleep = 0; P.moves.forEach(m => m.ppLeft = m.pp); }

/* ============ progressão ============ */
async function gainExp(xp) {
  const P = S.player, G = S.meta.growth;
  P.exp += xp; recalc(P);
  let leveled = false;
  while (P.level < 100 && P.exp >= G[P.level + 1]) {
    const before = { ...P.stats };
    P.level++; recalc(P); leveled = true; render();
    await say(`<b>${esc(P.nick || fmt(P.name))} subiu para o nível ${P.level}!</b>`, 'level');
    await say(STATS.map(s => `${STAT_PT[s]} +${P.stats[s] - before[s]}`).join(', '), 'muted');
    for (const mv of P.data.learnset.list.filter(m => m.level === P.level)) await learnMove(mv);
  }
  render();
  if (leveled) await checkEvolution();
}
async function learnMove(ref) {
  const P = S.player;
  if (P.moves.some(m => m.name === ref.name)) return;
  const mv = await loadMove(ref.url);
  if (P.moves.length < 4) { P.moves.push({ ...mv, ppLeft: mv.pp }); render(); await say(`${nm(P)} aprendeu ${esc(fmt(mv.name))}!`, 'good'); return; }
  const card = `<div class="mcard"><b>${esc(fmt(mv.name))}</b>: ${TYPE_PT[mv.type] || mv.type}, ${CLS_PT[mv.cls]}, poder ${mv.power ?? '—'}, precisão ${mv.acc ?? '—'}, PP ${mv.pp}<br>${esc(mv.desc)}</div>`;
  const c = await ask(`${nm(P)} quer aprender <b>${esc(fmt(mv.name))}</b>, mas já sabe 4 golpes. Esquecer qual?`,
    [...P.moves.map((m, i) => ({ label: `Esquecer ${esc(fmt(m.name))} (${m.power ?? '—'} pod.)`, value: i })), { label: `Não aprender ${esc(fmt(mv.name))}`, value: -1, ghost: true }], card);
  if (c >= 0) { const old = P.moves[c]; P.moves[c] = { ...mv, ppLeft: mv.pp }; render(); await say(`${nm(P)} esqueceu ${esc(fmt(old.name))} e aprendeu ${esc(fmt(mv.name))}!`, 'good'); }
  else await say(`${nm(P)} não aprendeu ${esc(fmt(mv.name))}.`);
}
function findNode(n, name) { if (n.name === name) return n; for (const c of n.to) { const f = findNode(c, name); if (f) return f; } return null; }
async function checkEvolution() {
  const P = S.player; if (!S.meta.evo) return;
  const node = findNode(S.meta.evo, P.data.speciesName); if (!node) return;
  const opts = node.to.filter(n => n.details.some(d => d.trigger === 'level-up' && d.min_level && d.min_level <= P.level));
  if (!opts.length) return;
  const c = await ask(`Algo está acontecendo com ${nm(P)}... Você sente seu corpo mudar. Deixar evoluir?`,
    [...opts.map(o => ({ label: `Evoluir para ${esc(fmt(o.name))}`, value: o.name })), { label: 'Resistir à evolução', value: null, ghost: true }]);
  if (!c) { await say(`${nm(P)} resistiu à evolução.`); return; }
  await evolve(c);
}
async function evolve(speciesName) {
  const P = S.player;
  const sp = await loadSpecies(`${API}/pokemon-species/${speciesName}/`);
  const data = await loadPokemon(sp.defaultPokemon);
  const oldName = fmt(P.name), idx = P.data.abilities.findIndex(a => a.name === P.ability);
  P.id = data.id; P.name = data.name; P.data = data;
  P.ability = (data.abilities[idx] || data.abilities[0]).name;
  recalc(P); render();
  await say(`Parabéns! ${esc(oldName)} evoluiu para <b>${esc(fmt(data.name))}</b>!`, 'level');
  for (const mv of data.learnset.list.filter(m => m.level === 0 || m.level === P.level)) await learnMove(mv);
}

/* ============ itens e exploração ============ */
const addItem = (k, n) => { S.bag[k] = (S.bag[k] || 0) + n; };
async function useItem(id, inBattle) {
  const it = ITEMS[id], P = S.player;
  if (!it || !S.bag[id]) return false;
  if (it.battle && !inBattle) { await say('Esse item só funciona durante uma batalha.'); return false; }
  if (it.heal) {
    if (P.hp >= P.stats.hp) { await say('O HP já está cheio.'); return false; }
    const h = Math.min(it.heal, P.stats.hp - P.hp); S.bag[id]--; heal(P, h); render();
    await say(`Você usou ${it.name}. ${nm(P)} recuperou ${h} HP.`, 'good');
  } else if (it.cure) {
    if (!P.status || !(it.cure === 'all' || it.cure.includes(P.status))) { await say('Não teria efeito agora.'); return false; }
    S.bag[id]--; P.status = null; P.sleep = 0; render();
    await say(`Você usou ${it.name}. ${nm(P)} está curado!`, 'good');
  } else if (it.ether) {
    if (P.moves.every(m => m.ppLeft >= m.pp)) { await say('Os PP já estão cheios.'); return false; }
    S.bag[id]--; P.moves.forEach(m => m.ppLeft = Math.min(m.pp, m.ppLeft + it.ether)); render();
    await say(`Você usou ${it.name}. PP restaurados.`, 'good');
  } else if (it.stage) {
    S.bag[id]--; await say(`Você usou ${it.name}.`);
    await changeStats(P, [{ stat: it.stage, change: 2 }]);
  } else if (it.candy) {
    if (P.level >= 100) { await say('Já está no nível máximo.'); return false; }
    S.bag[id]--; await say(`Você comeu uma ${it.name}.`);
    await gainExp(S.meta.growth[P.level + 1] - P.exp);
  }
  if (S.bag[id] <= 0) delete S.bag[id];
  render(); return true;
}
async function explore() {
  if (busy) return;
  busy = true; render();
  const z = zone();
  try {
    await say(`Você anda por ${z.name}...`, 'muted');
    const r = Math.random();
    if (r < 0.68) await startBattle(z);
    else if (r < 0.83) { const it = pick(FIND_ITEMS); addItem(it, 1); await say(`Você encontrou <b>${ITEMS[it].name}</b>!`, 'good'); }
    else if (r < 0.9) { const m = rand(20, 80); S.money += m; await say(`Você achou ₽${m} caídos no chão.`, 'good'); }
    else await say(pick(FLAVOR[z.id] || FLAVOR.default));
  } catch (e) {
    console.error(e); B = null; mode = 'explore'; ui.panel = 'main';
    log(apiErr(e), 'hit');
  } finally { busy = false; render(); save(); }
}

    const growth = await loadGrowth(sp.growthUrl);
    const evo = sp.evoUrl ? await loadEvo(sp.evoUrl) : null;
    PV.nick = ($('#pv-nick')?.value || '').trim();
    const mon = await makeMon(d, PV.level, { nature: PV.nature, ability: PV.ability, nick: PV.nick });
    mon.exp = growth[mon.level];
    const startZone = [...ZONES].reverse().find(z => z.pool && z.min <= mon.level) || ZONES[0];
    S = { player: mon, bag: { potion: 3, 'full-heal': 1 }, money: 500, zone: startZone.id, meta: { growth, evo }, wins: 0, log: [] };
    mode = 'explore'; ui.panel = 'main';
    buildGame();
    log(`Você abre os olhos em ${startZone.name}. Não há treinador por perto: desta vez, o Pokémon é você, ${nm(mon)}.`);
    log('Explore para encontrar Pokémon selvagens, itens e dinheiro. O jogo salva sozinho neste navegador.', 'muted');
    save();
  } catch (e) {
    btn.disabled = false; btn.textContent = 'Tentar de novo';
    $('#preview').insertAdjacentHTML('beforeend', `<p class="err">${apiErr(e)}</p>`);
  }
}

/* ============ eventos ============ */
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const v = b.dataset.v;
  switch (b.dataset.act) {
    case 'search': return previewSearch($('#q').value);
    case 'random': return previewSearch(rand(1, 1025));
    case 'pick': return previewSearch(v);
    case 'ability': PV.ability = v; return renderPreview();
    case 'start': return startGame(b);
    case 'explore': return explore();
    case 'zone': S.zone = v; save(); return render();
    case 'panel': ui.panel = v; return render();
    case 'heal': healFull(); log('Você descansou no Centro Pokémon. HP, PP e status restaurados.', 'good'); save(); return render();
    case 'buy': {
      const it = ITEMS[v]; if (!it || S.money < it.price) return;
      S.money -= it.price; addItem(v, 1); log(`Você comprou ${it.name} por ₽${it.price}.`); save(); return render();
    }
    case 'item': if (busy) return; busy = true; render(); try { await useItem(v, false); } finally { busy = false; render(); save(); } return;
    case 'item-b': return turn({ type: 'item', id: v });
    case 'move': return turn({ type: 'move', idx: +v });
    case 'run': return turn({ type: 'run' });
    case 'new': {
      if (busy) return;
      const ok = await ask('Começar um novo jogo? O progresso salvo neste navegador será apagado.', [{ label: 'Apagar e recomeçar', value: true }, { label: 'Cancelar', value: false, ghost: true }]);
      if (ok) { store.del(SAVE_KEY); S = null; B = null; PV = null; showCreate(); }
      return;
    }
  }
});
document.addEventListener('change', e => {
  if (!PV) return;
  if (e.target.id === 'pv-nature') PV.nature = e.target.value;
  if (e.target.id === 'pv-level') { PV.level = +e.target.value; renderPreview(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'q') previewSearch(e.target.value); });

/* ============ início ============ */
(function boot() {
  const s = store.get(SAVE_KEY);
  if (s?.player?.data && s.meta?.growth) {
    S = s; S.player.vol = freshVol(); mode = 'explore'; ui.panel = 'main';
    buildGame();
    (S.log || []).slice(-20).forEach(logRaw);
    log('Jogo carregado deste navegador.', 'muted');
  } else showCreate();
})();
</script>
</body>
